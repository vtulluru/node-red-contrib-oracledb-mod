<!-- Oracle-SERVER - CONFIG ----------------------------------------------------->

<script type="text/x-red" data-template-name="oracle-server">
    <div class="form-row">
        <ul style="background: #fff; min-width: 600px; margin-bottom: 20px;" id="node-config-oracle-server-tabs"></ul>
    </div>
    <div id="node-config-oracle-server-tabs-content" style="min-height: 170px;">
        <div id="oracle-server-tab-connection" style="display:none">
            <div class="form-row">
                <label for="node-config-input-connectionname" style="width: 150px;"><i class="fa fa-cloud"></i> Connection Name</label>
                <input class="input-append-left" type="text" required="required" id="node-config-input-connectionname" placeholder="Name">
            </div>
            <div class="form-row">
                <label for="node-config-input-usethickmode" style="width: 150px;"><i class="fa fa-cog"></i> Driver Mode</label>
                <select class="input-append-left" id="node-config-input-usethickmode">
                    <option value="false">Thin (recommended)</option>
                    <option value="true">Thick (legacy / Oracle 11g / AQ / CQN)</option>
                </select>
            </div>
            <div class="form-row" id="legacy-thick-warning" style="display:none; background:#fff8c4; border:1px solid #e8c000; padding:6px 8px; border-radius:3px;">
                <i class="fa fa-exclamation-triangle"></i>
                This config is running in <b>thick mode for backwards compatibility</b>.
                Thin mode is recommended for v0.8+. Switch <b>Driver Mode</b> to Thin and clear
                the Instant Client Path to migrate. See README for details.
            </div>
            <div class="form-row">
                <label for="node-config-input-connectiontype" style="width: 150px;"><i class="fa fa-question"></i> Connection Type</label>
                <select class="input-append-left" id="node-config-input-connectiontype">
                    <option value="Classic">Classic</option>
                    <option value="TNS Name">TNS Name</option>
                </select>
            </div>
            <div class="form-row thick-only">
                <label for="node-config-input-instantclientpath" style="width: 150px;"><i class="fa fa-folder"></i> Instant Client Path</label>
                <input class="input-append-left" type="text" id="node-config-input-instantclientpath" placeholder="/path/to/instantclient">
            </div>
            <div class="form-row">
                <label for="node-config-input-configdir" style="width: 150px;"><i class="fa fa-folder-o"></i> TNS_ADMIN</label>
                <input class="input-append-left" type="text" id="node-config-input-configdir" placeholder="directory containing tnsnames.ora" style="width: 50%;">
                <a href="#" id="oracle-configdir-edit" style="display:none; margin-left:8px;">Edit</a>
                <span id="oracle-configdir-from-env" style="display:none; margin-left:8px; color:#888; font-size:0.85em;">(from $TNS_ADMIN)</span>
            </div>
            <div id="wallet-container" class="connection-type">
                <div class="form-row">
                    <label for="node-config-input-tnsname" style="width: 150px;"><i class="fa fa-pencil"></i> TNS Name</label>
                    <input class="input-append-left" type="text" id="node-config-input-tnsname" list="oracle-tns-aliases" placeholder="tns_name" style="width: 60%;" autocomplete="off">
                    <datalist id="oracle-tns-aliases"></datalist>
                    <span id="oracle-tns-status" style="margin-left: 8px; color: #888; font-size: 0.9em;"></span>
                </div>
            </div>
            <div id="classic-container" class="connection-type">
                <div class="form-row">
                    <label for="node-config-input-host" style="width: 150px;"><i class="fa fa-globe"></i> Server</label>
                    <input class="input-append-left" type="text" id="node-config-input-host" placeholder="localhost" style="width: 40%">
                    <label for="node-config-input-port" style="margin-left: 10px; width: 35px;"> Port</label>
                    <input type="text" id="node-config-input-port" placeholder="1521" style="width:45px">
                </div>
                <div class="form-row">
                    <label for="node-config-input-db" style="width: 150px;"><i class="fa fa-home"></i> Database</label>
                    <input type="text" id="node-config-input-db" placeholder="Service / SID">
                </div>
            </div>
            <hr/>
            <div class="form-row">
                <button type="button" class="red-ui-button" id="oracle-test-btn"><i class="fa fa-plug"></i> Test Connection</button>
                <button type="button" class="red-ui-button" id="oracle-stats-btn" style="margin-left: 6px;"><i class="fa fa-tachometer"></i> Pool Stats</button>
                <span id="oracle-test-status" style="margin-left: 10px;"></span>
            </div>
            <div id="oracle-stats-panel" style="display:none; margin: 4px 0 10px 0; padding: 8px; border: 1px solid #ddd; border-radius: 3px; background: #eef7ff; font-family: monospace; font-size: 0.85em; white-space: pre-wrap;"></div>
            <div id="oracle-test-result" style="display:none; margin: 4px 0 10px 0; padding: 8px; border: 1px solid #ddd; border-radius: 3px; background: #f8f8f8; font-family: monospace; font-size: 0.85em; white-space: pre-wrap;"></div>
            <hr/>
            <h4>Connection Pool</h4>
            <div class="form-row">
                <label for="node-config-input-poolmin" style="width: 150px;"><i class="fa fa-minus-square-o"></i> Min Connections</label>
                <input type="number" id="node-config-input-poolmin" placeholder="0" style="width: 60px;">
            </div>
            <div class="form-row">
                <label for="node-config-input-poolmax" style="width: 150px;"><i class="fa fa-plus-square-o"></i> Max Connections</label>
                <input type="number" id="node-config-input-poolmax" placeholder="4" style="width: 60px;">
            </div>
            <div class="form-row">
                <label for="node-config-input-poolincrement" style="width: 150px;"><i class="fa fa-plus"></i> Pool Increment</label>
                <input type="number" id="node-config-input-poolincrement" placeholder="1" style="width: 60px;">
            </div>
            <div class="form-row">
                <label for="node-config-input-pooltimeout" style="width: 150px;"><i class="fa fa-clock-o"></i> Idle Timeout (s)</label>
                <input type="number" id="node-config-input-pooltimeout" placeholder="60" style="width: 60px;">
            </div>
            <div class="form-row">
                <label for="node-config-input-queuetimeout" style="width: 150px;"><i class="fa fa-hourglass-half"></i> Queue Timeout (ms)</label>
                <input type="number" id="node-config-input-queuetimeout" placeholder="60000" style="width: 80px;">
            </div>
            <div class="form-row">
                <label for="node-config-input-stmtcachesize" style="width: 150px;"><i class="fa fa-database"></i> Stmt Cache Size</label>
                <input type="number" id="node-config-input-stmtcachesize" placeholder="30" style="width: 60px;">
            </div>
            <hr/>
            <h4>Retry on Transient Errors</h4>
            <div class="form-row">
                <label for="node-config-input-maxretries" style="width: 150px;"><i class="fa fa-refresh"></i> Max Retries</label>
                <input type="number" id="node-config-input-maxretries" placeholder="3" style="width: 60px;">
            </div>
            <div class="form-row">
                <label for="node-config-input-retrydelay" style="width: 150px;"><i class="fa fa-clock-o"></i> Initial Delay (ms)</label>
                <input type="number" id="node-config-input-retrydelay" placeholder="1000" style="width: 80px;">
            </div>
        </div>
        <div id="oracle-server-tab-security" style="display:none">
            <div class="form-row">
                <label for="node-config-input-user" style="width: 150px;"><i class="fa fa-user"></i> User</label>
                <input type="text" id="node-config-input-user" style="width: 60%;">
            </div>
            <div class="form-row">
                <label for="node-config-input-password" style="width: 150px;"><i class="fa fa-lock"></i> Password</label>
                <input type="password" id="node-config-input-password" style="width: 60%;">
            </div>
            <hr/>
            <h4>Wallet (mTLS)</h4>
            <div class="form-row">
                <label for="node-config-input-walletlocation" style="width: 150px;"><i class="fa fa-folder-o"></i> Wallet Location</label>
                <input class="input-append-left" type="text" id="node-config-input-walletlocation" placeholder="(defaults to TNS_ADMIN if blank)" style="width: 60%;">
            </div>
            <div class="form-row">
                <label for="node-config-input-walletpassword" style="width: 150px;"><i class="fa fa-lock"></i> Wallet Password</label>
                <input class="input-append-left" type="password" id="node-config-input-walletpassword" placeholder="(if wallet has SSO file, leave blank)" style="width: 60%;">
            </div>
            <hr/>
            <div class="form-row">
                <button type="button" class="red-ui-button" id="oracle-test-btn-sec"><i class="fa fa-plug"></i> Test Connection</button>
                <span id="oracle-test-status-sec" style="margin-left: 10px;"></span>
            </div>
            <div id="oracle-test-result-sec" style="display:none; margin: 4px 0 10px 0; padding: 8px; border: 1px solid #ddd; border-radius: 3px; background: #f8f8f8; font-family: monospace; font-size: 0.85em; white-space: pre-wrap;"></div>
        </div>
    </div>
</script>
<script type="text/x-red" data-help-name="oracle-server">
    <p>Configures the connection to your Oracle Database. Using a connection pool is recommended for stability.</p>

    <h3>Driver Mode</h3>
    <dl class="message-properties">
        <dt>Thin (recommended)</dt>
        <dd>Pure-JS driver, no Oracle Instant Client install required. Works with Oracle 12.1+ servers, Autonomous Database (wallets), IAM tokens, LOBs, REF CURSOR.</dd>
        <dt>Thick</dt>
        <dd>Required only for: Oracle 11g servers, Advanced Queuing (AQ), Continuous Query Notification (CQN), sharding. Needs Oracle Instant Client installed and an Instant Client Path set.</dd>
    </dl>

    <h3>Wallet / Autonomous Database</h3>
    <p>Point <b>Wallet / TNS_ADMIN</b> at the directory containing your unzipped wallet (with <code>tnsnames.ora</code>, <code>cwallet.sso</code>, etc.). In thin mode you can also override the wallet folder separately via <b>Wallet Location</b>. If your wallet has <code>cwallet.sso</code>, leave <b>Wallet Password</b> blank.</p>

    <h3>Connection Pool</h3>
    <dl class="message-properties">
        <dt>Min / Max Connections</dt>
        <dd>Pool size bounds. Default 0 / 4.</dd>
        <dt>Pool Increment</dt>
        <dd>Connections added each time the pool grows. Default 1.</dd>
        <dt>Idle Timeout (s)</dt>
        <dd>Seconds a connection can sit idle before being closed. Default 60.</dd>
        <dt>Queue Timeout (ms)</dt>
        <dd>How long a query waits for a free connection before failing with NJS-040. Default 60000.</dd>
        <dt>Stmt Cache Size</dt>
        <dd>Number of prepared statements cached per connection. Default 30.</dd>
    </dl>

    <h3>Retry on Transient Errors</h3>
    <p>The node automatically retries on transient failures (NJS-003, NJS-040, ORA-03113, ORA-12541, ORA-12170, etc.) with exponential backoff. Set <b>Max Retries</b> to 0 to disable.</p>
</script>
