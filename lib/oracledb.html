<script type="text/x-red" data-help-name="oracle-server">
    <p>Configures the connection to your Oracle Database. Using a connection pool is recommended for stability.</p>

    <h3>Driver Mode</h3>
    <dl class="message-properties">
        <dt>Thin (recommended)</dt>
        <dd>Pure-JS driver, no Oracle Instant Client install required. Works with Oracle 12.1+ servers, Autonomous Database (wallets), IAM tokens, LOBs, REF CURSOR.</dd>
        <dt>Thick</dt>
        <dd>Required only for: Oracle 11g servers, Advanced Queuing (AQ), Continuous Query Notification (CQN), sharding. Needs Oracle Instant Client installed and an Instant Client Path set.</dd>
    </dl>

    <h3>Wallet / Autonomous Database</h3>
    <p>Point <b>Wallet / TNS_ADMIN</b> at the directory containing your unzipped wallet (with <code>tnsnames.ora</code>, <code>cwallet.sso</code>, etc.). In thin mode you can also override the wallet folder separately via <b>Wallet Location</b>. If your wallet has <code>cwallet.sso</code>, leave <b>Wallet Password</b> blank.</p>

    <h3>Connection Pool</h3>
    <dl class="message-properties">
        <dt>Min / Max Connections</dt>
        <dd>Pool size bounds. Default 0 / 4.</dd>
        <dt>Pool Increment</dt>
        <dd>Connections added each time the pool grows. Default 1.</dd>
        <dt>Idle Timeout (s)</dt>
        <dd>Seconds a connection can sit idle before being closed. Default 60.</dd>
        <dt>Queue Timeout (ms)</dt>
        <dd>How long a query waits for a free connection before failing with NJS-040. Default 60000.</dd>
        <dt>Stmt Cache Size</dt>
        <dd>Number of prepared statements cached per connection. Default 30.</dd>
    </dl>

    <h3>Retry on Transient Errors</h3>
    <p>The node automatically retries on transient failures (NJS-003, NJS-040, ORA-03113, ORA-12541, ORA-12170, etc.) with exponential backoff. Set <b>Max Retries</b> to 0 to disable.</p>
</script>

<script type="text/x-red" data-help-name="oracledb">
  <p>Oracle database node. Executes SQL queries, PL/SQL blocks, and stored procedures.</p>
  
  <h3>Inputs</h3>
  <dl class="message-properties">
    <dt>payload <span class="property-type">array | object</span></dt>
    <dd>
        If an array, the values are used as positional bind parameters for the query (e.g., <code>:1, :2</code>).
        If an object, it can be used with <b>Field Mappings</b> to generate the parameter array.
    </dd>
    <dt class="optional">query <span class="property-type">string</span></dt>
    <dd>An SQL query or PL/SQL block to execute. If not provided, the query configured in the node's editor will be used.</dd>
    <dt class="optional">bindVars <span class="property-type">object</span></dt>
    <dd>
        For advanced use cases like stored procedures with <code>OUT</code> parameters. This object provides explicit bind definitions.
        <pre>msg.bindVars = {
    output: { dir: "BIND_OUT", type: "STRING" },
    input:  { dir: "BIND_IN", val: "my_value" }
};</pre>
    </dd>
    <dt class="optional">fieldMappings <span class="property-type">array</span></dt>
    <dd>An array of strings used to map properties from an object in <code>msg.payload</code> to a positional array for binding.</dd>
  </dl>

  <h3>Outputs</h3>
  <p>The output depends on the <b>Action</b> selected in the "Query results" tab.</p>
  <dl class="message-properties">
      <dt>ignore query results</dt>
      <dd>No message is sent.</dd>
      <dt>send single query result message</dt>
      <dd>Sends <b>one message</b>. <code>msg.payload</code> will be an array containing <b>all rows</b> returned by the query.</dd>
      <dt>send single message with metadata</dt>
      <dd>Sends <b>one message</b>. <code>msg.payload</code> will be an object containing metadata like <code>rowsAffected</code> and any <code>outBinds</code> from a stored procedure. This is useful for DML (INSERT, UPDATE, DELETE) or procedure calls.</dd>
      <dt>send multiple query result messages</dt>
      <dd>
          Used for processing very large result sets without high memory usage. It sends <b>multiple messages</b>, each containing a chunk of rows. The size of the chunk is determined by the <b>Msg rows</b> setting.
          <br/><br/>
          <b>Note:</b> If the total number of rows is less than the "Msg rows" limit, this option will behave identically to "send single query result message".
      </dd>
  </dl>
  
  <h3>Batch mode (executeMany)</h3>
  <p>Enable <b>Batch mode</b> (or set <code>msg.executeMany = true</code>) to insert/update many rows in a single round-trip. <code>msg.payload</code> must be an array of bind objects (named binds) or array of arrays (positional). The node sends a single output message with <code>{ rowsAffected, outBinds, batchErrors }</code>.</p>
  <pre>// 1000-row insert in one call
msg.payload = [ {id:1, name:"a"}, {id:2, name:"b"}, /* ... */ ];
msg.executeMany = true;
// query: INSERT INTO t (id, name) VALUES (:id, :name)</pre>

  <h3>Executing Scripts</h3>
  <p>
      The node executes a single SQL statement or a single PL/SQL block at a time. To run multiple DML statements (<code>INSERT</code>, <code>UPDATE</code>, etc.) as a single transaction, wrap them in a <code>BEGIN...END;</code> block. To run multiple sequential queries, chain multiple <b>oracledb</b> nodes together in your flow.
  </p>
</script>
<script type="text/javascript">
//
// -- oracle server --------------------------------------------------------------------------------
//
RED.nodes.registerType("oracle-server", {
    category: "config",
    defaults: {
        connectionname: { value: "", required: true },
        tnsname: { value: "" },
        connectiontype: { value: "Classic" },
        usethickmode: { value: false },
        instantclientpath: { value: "" },
        configdir: { value: "" },
        walletlocation: { value: "" },
        host: { value: "localhost", required: false },
        port: { value: 1521, required: false, validate: RED.validators.number() },
        db: { value: "", required: false },
        poolmin: { value: 0, required: false, validate: RED.validators.number(true) },
        poolmax: { value: 4, required: false, validate: RED.validators.number(true) },
        poolincrement: { value: 1, required: false, validate: RED.validators.number(true) },
        pooltimeout: { value: 60, required: false, validate: RED.validators.number(true) },
        queuetimeout: { value: 60000, required: false, validate: RED.validators.number(true) },
        stmtcachesize: { value: 30, required: false, validate: RED.validators.number(true) },
        maxretries: { value: 3, required: false, validate: RED.validators.number(true) },
        retrydelay: { value: 1000, required: false, validate: RED.validators.number(true) },
    },
    credentials: {
        user: { type: "text" },
        password: { type: "password" },
        walletpassword: { type: "password" }
    },
    label: function () {
        return this.connectionname;
    },
    oneditprepare: function () {
        var tabs = RED.tabs.create({
            id: "node-config-oracle-server-tabs",
            onchange: function (tab) {
                $("#node-config-oracle-server-tabs-content").children().hide();
                $("#" + tab.id).show();
            }
        });
        tabs.addTab({ id: "oracle-server-tab-connection", label: "Connection" });
        tabs.addTab({ id: "oracle-server-tab-security", label: "Security" });
        setTimeout(function () { tabs.resize(); }, 0);
        // --- Legacy migration detection ---
        // Pre-0.8 configs have instantclientpath set but no usethickmode field.
        // We coerce them into thick mode and show the migration warning.
        var self = this;
        var isLegacy = !!self.instantclientpath && (self.usethickmode === undefined || self.usethickmode === null);
        if (isLegacy) {
            $("#node-config-input-usethickmode").val("true");
            $("#legacy-thick-warning").show();
        }
        else {
            $("#node-config-input-usethickmode").val(self.usethickmode === true || self.usethickmode === "true" ? "true" : "false");
        }
        // --- Driver mode toggle ---
        function refreshModeFields() {
            var thick = String($("#node-config-input-usethickmode").val()) === "true";
            $(".thick-only").toggle(thick);
            $(".thin-only").toggle(!thick);
            // Hide the legacy warning if user has switched to thin
            if (!thick)
                $("#legacy-thick-warning").hide();
        }
        $("#node-config-input-usethickmode").on("change", refreshModeFields);
        refreshModeFields();
        // --- TNS alias auto-discovery from wallet/TNS_ADMIN ---
        function loadTnsAliases() {
            var dir = String($("#node-config-input-configdir").val() || "").trim();
            var wallet = String($("#node-config-input-walletlocation").val() || "").trim();
            var $status = $("#oracle-tns-status");
            var $list = $("#oracle-tns-aliases");
            var params = [];
            if (dir)
                params.push("dir=" + encodeURIComponent(dir));
            if (wallet)
                params.push("walletLocation=" + encodeURIComponent(wallet));
            $status.text("loading...");
            $.getJSON("oracle-server/tnsnames?" + params.join("&"), function (data) {
                $list.empty();
                if (data && Array.isArray(data.aliases) && data.aliases.length) {
                    data.aliases.forEach(function (a) { return $list.append($("<option>").attr("value", a)); });
                    $status.text(data.aliases.length + " aliases from " + data.source);
                }
                else if (data && data.error === "no_path") {
                    $status.text("(set Wallet / TNS_ADMIN, or TNS_ADMIN env, to auto-load)");
                }
                else if (data && data.error === "not_found") {
                    var tried = (data.tried || []).join(", ");
                    $status.text("no tnsnames.ora found (tried: " + tried + ")");
                }
                else {
                    $status.text("(no aliases found)");
                }
            }).fail(function () { $status.text("(load failed)"); });
        }
        $("#node-config-input-configdir, #node-config-input-walletlocation").on("change blur", loadTnsAliases);
        // If TNS_ADMIN is set in the Node-RED process env AND the user hasn't
        // configured their own configdir, auto-fill and lock the field — clearer
        // signal than a placeholder. "Edit" link lets them override.
        $.getJSON("oracle-server/env", function (env) {
            if (env && env.TNS_ADMIN) {
                var $cd = $("#node-config-input-configdir");
                if (!String($cd.val() || "").trim()) {
                    $cd.val(env.TNS_ADMIN).prop("readonly", true).css("background-color", "#f4f4f4");
                    $("#oracle-configdir-edit").show();
                    $("#oracle-configdir-from-env").show();
                    loadTnsAliases();
                }
                $("#oracle-configdir-edit").on("click", function (e) {
                    e.preventDefault();
                    $("#node-config-input-configdir").prop("readonly", false).css("background-color", "");
                    $("#oracle-configdir-edit").hide();
                    $("#oracle-configdir-from-env").hide();
                });
            }
        });
        loadTnsAliases();
        // --- Test Connection (shared by both buttons) ---
        function runTest($status, $result) {
            $status.html('<i class="fa fa-spinner fa-spin"></i> Testing...').css("color", "#888");
            $result.hide().empty();
            var body = {
                nodeId: self.id || null,
                usethickmode: String($("#node-config-input-usethickmode").val()) === "true",
                instantclientpath: $("#node-config-input-instantclientpath").val(),
                configdir: $("#node-config-input-configdir").val(),
                walletlocation: $("#node-config-input-walletlocation").val(),
                walletpassword: $("#node-config-input-walletpassword").val(),
                tnsname: $("#node-config-input-tnsname").val(),
                host: $("#node-config-input-host").val(),
                port: $("#node-config-input-port").val(),
                db: $("#node-config-input-db").val(),
                user: $("#node-config-input-user").val(),
                password: $("#node-config-input-password").val()
            };
            $.ajax({
                url: "oracle-server/test",
                method: "POST",
                contentType: "application/json",
                data: JSON.stringify(body)
            }).done(function (data) {
                if (data.ok) {
                    var t = data.timing || {};
                    var timingTxt = t.connectMs != null ? " \u00B7 ".concat(t.connectMs, "ms connect, ").concat(t.totalMs, "ms total") : "";
                    $status.html('<i class="fa fa-check-circle"></i> Connected (' + data.mode + ' mode)' + timingTxt).css("color", "#3a8f3a");
                    var info = data.info || {};
                    var aliasesInWallet_1 = [];
                    $("#oracle-tns-aliases option").each(function () { aliasesInWallet_1.push($(this).attr("value")); });
                    var lines_1 = [
                        "Connect string : " + data.connectString,
                        "Database name  : " + (info.DB_NAME || "(n/a)"),
                        "Service name   : " + (info.SERVICE || "(n/a)"),
                        "Server host    : " + (info.SERVER_HOST || "(n/a)"),
                        "User           : " + (info.CURR_USER || "(n/a)"),
                        "Current schema : " + (info.CURR_SCHEMA || "(n/a)"),
                        "Connect time   : " + (t.connectMs != null ? t.connectMs + " ms" : "(n/a)"),
                        "Total time     : " + (t.totalMs != null ? t.totalMs + " ms" : "(n/a)")
                    ];
                    if (aliasesInWallet_1.length) {
                        lines_1.push("");
                        lines_1.push("Other services in wallet:");
                        aliasesInWallet_1.forEach(function (a) {
                            if (a !== body.tnsname)
                                lines_1.push("  - " + a);
                        });
                    }
                    if (Array.isArray(data.schemas) && data.schemas.length) {
                        lines_1.push("");
                        lines_1.push("Accessible schemas (" + data.schemaTotal + "):");
                        var shown = data.schemas.slice(0, 30);
                        shown.forEach(function (s) { return lines_1.push("  - " + s); });
                        if (data.schemaTotal > shown.length) {
                            lines_1.push("  ... +" + (data.schemaTotal - shown.length) + " more");
                        }
                    }
                    $result.text(lines_1.join("\n")).show();
                }
                else {
                    var tFail = data.timing && data.timing.totalMs != null ? " (after ".concat(data.timing.totalMs, "ms)") : "";
                    $status.html('<i class="fa fa-times-circle"></i> Failed' + tFail).css("color", "#c33");
                    $result.text("Error: " + data.error + "\nConnect string: " + data.connectString).show();
                }
            }).fail(function (xhr) {
                $status.html('<i class="fa fa-times-circle"></i> HTTP ' + xhr.status).css("color", "#c33");
            });
        }
        // --- Pool stats panel ---
        // The button toggles a panel that auto-refreshes every 2s while open.
        // Requires the config to be deployed (we need a node id to fetch stats).
        var statsTimer = null;
        self._stopStatsTimer = function () { if (statsTimer) {
            clearInterval(statsTimer);
            statsTimer = null;
        } };
        function fetchStats() {
            var id = self.id;
            var $panel = $("#oracle-stats-panel");
            if (!id) {
                $panel.text("Save and Deploy this config first to inspect live pool stats.").show();
                return;
            }
            $.getJSON("oracle-server/" + encodeURIComponent(id) + "/stats", function (data) {
                if (!data.ok) {
                    $panel.text("Pool not available: " + (data.error || "unknown")).show();
                    return;
                }
                var s = data.summary;
                var lines = [
                    "Driver mode      : " + data.mode,
                    "Open / In use    : " + s.connectionsOpen + " / " + s.connectionsInUse,
                    "Pool bounds      : min=" + s.poolMin + ", max=" + s.poolMax,
                    "Queue length     : " + (s.queueLength != null ? s.queueLength : "(n/a)"),
                    "Queue max        : " + (s.queueMax != null ? s.queueMax : "(unlimited)"),
                    "",
                    "Peak in-use      : " + s.peakConnectionsInUse + " / " + s.poolMax,
                    "Peak queued      : " + s.peakQueueLength,
                    "Tracking since   : " + (s.peakSince || "(pool not started)"),
                    "Gathered         : " + s.gatheredAt
                ];
                // Sizing hints
                if (s.peakConnectionsInUse >= s.poolMax) {
                    lines.push("");
                    lines.push("⚠ Peak hit poolMax — consider raising Max Connections.");
                }
                if (s.peakQueueLength > 0) {
                    lines.push("⚠ Queue depth went above 0 — pool was saturated at least once.");
                }
                $panel.text(lines.join("\n")).show();
            }).fail(function () {
                $panel.text("Failed to fetch pool stats").show();
            });
        }
        $("#oracle-stats-btn").on("click", function () {
            if (statsTimer) {
                clearInterval(statsTimer);
                statsTimer = null;
                $("#oracle-stats-panel").hide();
            }
            else {
                fetchStats();
                statsTimer = setInterval(fetchStats, 2000);
            }
        });
        $("#oracle-test-btn").on("click", function () { runTest($("#oracle-test-status"), $("#oracle-test-result")); });
        $("#oracle-test-btn-sec").on("click", function () { runTest($("#oracle-test-status-sec"), $("#oracle-test-result-sec")); });
        // --- Classic vs TNS toggle (unchanged behavior) ---
        $(".connection-type").hide();
        $("#node-config-input-connectiontype").on("change", function (evt) {
            var ct = evt.currentTarget;
            if (ct.value === "TNS Name") {
                $("#wallet-container").show();
                $("#classic-container").hide();
                $("#node-config-input-host").val("");
                $("#node-config-input-port").val("");
                $("#node-config-input-db").val("");
            }
            else {
                $("#wallet-container").hide();
                $("#classic-container").show();
                $("#node-config-input-tnsname").val("");
            }
        }).trigger("change");
    },
    oneditsave: function () {
        // Coerce select-string back to boolean so the runtime sees a real bool.
        var v = String($("#node-config-input-usethickmode").val());
        this.usethickmode = (v === "true");
        if (this._stopStatsTimer)
            this._stopStatsTimer();
    },
    oneditcancel: function () {
        if (this._stopStatsTimer)
            this._stopStatsTimer();
    }
});

//
// -- oracledb -------------------------------------------------------------------------------------
//
RED.nodes.registerType("oracledb", {
    category: "storage",
    defaults: {
        name: { value: "" },
        usequery: { value: false },
        query: { value: "INSERT INTO oracleTableName" +
                "\n\t(fieldName1, fieldName2, Fieldname3)" +
                "\n\tVALUES (" +
                "\n\t\t:valueOfValuesArrayIndex0," +
                "\n\t\t:valueOfValuesArrayIndex1," +
                "\n\t\t:valueOfValuesArrayIndex2," +
                "\n\t)" },
        usemappings: { value: false },
        mappings: { value: "[" +
                "\n\t\"location.of.first.array.index.field.in.msg.payload\"," +
                "\n\t\"location.of.second.array.index.field\"," +
                "\n\t\"last_array_indexfield.in[3]\"" +
                "\n]" },
        server: { type: "oracle-server", required: true },
        resultaction: { value: "multi" },
        resultlimit: { value: 100 },
        usemany: { value: false }
    },
    inputs: 1,
    outputs: 1,
    color: "#ff6666",
    icon: "db.png",
    align: "right",
    label: function () {
        return this.name || "oracledb";
    },
    labelStyle: function () {
        return this.name ? "node_label_italic" : "";
    },
    oneditprepare: function () {
        // use query editor
        var queryField = $("#node-input-query");
        var queryEditor = RED.editor.createEditor({
            id: "node-input-query-editor",
            mode: "ace/mode/sql", // unfortunately not yet included in the node-red version of ace
            value: queryField.val()
        });
        queryEditor.getSession().on("change", function () {
            queryField.val(queryEditor.getSession().getValue());
        });
        // use mappings editor
        var mappingsField = $("#node-input-mappings");
        var mappingsEditor = RED.editor.createEditor({
            id: "node-input-mappings-editor",
            mode: "ace/mode/json",
            value: mappingsField.val()
        });
        mappingsEditor.getSession().on("change", function () {
            mappingsField.val(mappingsEditor.getSession().getValue());
        });
        var visibleTab = "query";
        var tabs = RED.tabs.create({
            id: "node-input-oracle-out-tabs",
            onchange: function (tab) {
                $("#node-input-oracle-out-tabs-content").children().hide();
                $("#" + tab.id).show();
                if (tab.id === "oracle-out-tab-query") {
                    visibleTab = "query";
                    functionDialogResize();
                    queryEditor.focus();
                }
                if (tab.id === "oracle-out-tab-mappings") {
                    visibleTab = "mappings";
                    functionDialogResize();
                    mappingsEditor.focus();
                }
            }
        });
        tabs.addTab({
            id: "oracle-out-tab-connection",
            label: "Server connection"
        });
        tabs.addTab({
            id: "oracle-out-tab-query",
            label: "SQL query"
        });
        tabs.addTab({
            id: "oracle-out-tab-mappings",
            label: "Field mappings"
        });
        tabs.addTab({
            id: "oracle-out-tab-results",
            label: "Query results"
        });
        setTimeout(function () { tabs.resize(); }, 0);
        // resize editor areas to fit the edit window
        var functionDialogResize = function () {
            var height = $("#dialog-form").height();
            height -= $("#node-input-oracle-out-tabs").outerHeight(true);
            var rows = $("#oracle-out-tab-" + visibleTab + ">div:not(.node-input-" + visibleTab + "-text-editor-row)");
            for (var i = 0; i < rows.length; i++) {
                height -= $(rows[i]).outerHeight(true);
            }
            var editorRow = $("#dialog-form>div.node-input-" + visibleTab + "-text-editor-row");
            if (editorRow.css("marginTop")) {
                height -= parseInt(editorRow.css("marginTop"), 10);
            }
            if (editorRow.css("marginBottom")) {
                height -= parseInt(editorRow.css("marginBottom"), 10);
            }
            height -= 5;
            $("#node-input-" + visibleTab + "-editor").css("height", height + "px");
            if (visibleTab === "query") {
                queryEditor.resize();
            }
            else {
                mappingsEditor.resize();
            }
        };
        var d = $("#dialog");
        d.on("dialogresize", functionDialogResize);
        d.one("dialogopen", function () {
            var size = d.dialog("option", "sizeCache-function");
            if (size) {
                d.dialog("option", "width", size.width);
                d.dialog("option", "height", size.height);
                functionDialogResize();
            }
        });
        d.one("dialogclose", function () {
            d.off("dialogresize", functionDialogResize);
        });
    }
});

</script>
