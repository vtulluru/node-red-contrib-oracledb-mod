<script type="text/x-red" data-template-name="oracledb">
    <div class="form-row">
        <ul style="background: #fff; min-width: 600px; margin-bottom: 20px;" id="node-input-oracle-out-tabs"></ul>
    </div>
    <div id="node-input-oracle-out-tabs-content" style="min-height: 170px;">
        <div id="oracle-out-tab-connection" style="display:none">
              <div class="form-row">
                  <label for="node-input-server"><i class="fa fa-globe"></i> Server</label>
                  <input type="text" id="node-input-server" type="oracle-server">
              </div>

              <br/>
              <div class="form-row">
                  <label for="node-input-name"><i class="fa fa-tag"></i> Name</label>
                  <input type="text" id="node-input-name" placeholder="Name">
              </div>
        </div>
        <div id="oracle-out-tab-query" style="display:none">
            <div class="form-row" style="margin-bottom: 8px">
                <input type="checkbox" id="node-input-usequery" style="display: inline-block; width: auto; vertical-align: top;">
                <label for="node-input-usequery" style="width: 70%;">always execute this Oracle SQL statement (even if <i>msg.query</i> exists)</label>
                <button type="button" id="node-btn-browse-schema" class="red-ui-button red-ui-button-small" style="float: right;"><i class="fa fa-database"></i> Browse Schema</button>
            </div>
            <div id="schema-browser-panel" style="display:none; margin-bottom: 10px; border: 1px solid #ddd; padding: 8px 10px; border-radius: 4px; background: #fafafa; max-height: 320px; overflow-y: auto;">
                <div style="display:flex; justify-content:space-between; margin-bottom: 6px; align-items: center; border-bottom: 1px solid #e2e8f0; padding-bottom: 4px;">
                    <span id="schema-browser-db-info" style="font-weight: bold; font-size: 11px; color: #2d3748;"><i class="fa fa-database"></i> Database: Loading...</span>
                    <button type="button" id="schema-browser-close" class="red-ui-button red-ui-button-small">Close</button>
                </div>
                <div style="display:flex; gap: 6px; margin-bottom: 6px; align-items: center;">
                    <select id="schema-browser-schema-select" style="width: 36%; font-size: 11px; height: 26px;">
                        <option value="">All Schemas</option>
                    </select>
                    <select id="schema-browser-type-select" style="width: 26%; font-size: 11px; height: 26px;">
                        <option value="ALL">All Types</option>
                        <option value="TABLE">Tables</option>
                        <option value="VIEW">Views</option>
                    </select>
                    <input type="text" id="schema-browser-filter" placeholder="Filter objects..." style="flex: 1; font-size: 11px; height: 26px;">
                </div>
                <div id="schema-browser-status" style="font-size: 11px; color: #666; margin-bottom: 4px;"></div>
                <div id="schema-browser-list" style="font-family: monospace; font-size: 12px;"></div>
            </div>

            <div class="form-row node-input-query-text-editor-row" style="margin-bottom: 4px;">
                <textarea id="node-input-query" style="display: none;"></textarea>
                <div style="height: 250px;" class="node-text-editor" id="node-input-query-editor" ></div>
            </div>
            <div id="query-binds-indicator" style="font-size: 11px; color: #4a5568; padding: 4px 8px; background: #edf2f7; border-radius: 3px; display: flex; align-items: center; justify-content: space-between;">
                <span><i class="fa fa-tags" style="color: #718096;"></i> <b>Detected Binds:</b> <span id="query-detected-binds-list" style="color: #2b6cb0; font-family: monospace;">(none)</span></span>
                <span style="color: #718096; font-size: 10px;">Bind via <i>msg.payload</i> or <i>msg.bindVars</i></span>
            </div>
        </div>
        <div id="oracle-out-tab-mappings" style="display:none">
            <div class="form-row" style="margin-bottom: 0px">
                <input type="checkbox" id="node-input-usemappings" style="display: inline-block; width: auto; vertical-align: top;">
                <label for="node-input-usemappings" style="width: 80%;"> always use field mappings (even if <i>msg.payload</i> is an array)</label>
            </div>

            <div class="form-row node-input-mappings-text-editor-row">
                <textarea id="node-input-mappings" style="display: none;"></textarea>
                <div style="height: 250px;" class="node-text-editor" id="node-input-mappings-editor" ></div>
            </div>
        </div>
        <div id="oracle-out-tab-results" style="display:none">
            <div class="form-row">
                <label for="node-input-txaction"><i class="fa fa-exchange"></i> Transaction</label>
                <select type="text" id="node-input-txaction" style="width: 270px;">
                    <option value="auto" selected>Auto-commit (standalone)</option>
                    <option value="begin">Begin Transaction (pass via msg._oracleTx)</option>
                    <option value="continue">Continue Transaction</option>
                    <option value="commit">Commit Transaction</option>
                    <option value="rollback">Rollback Transaction</option>
                </select>
            </div>

            <div class="form-row">
                <label for="node-input-resultaction"><i class="fa fa-hand-o-right"></i> Action</label>
                <select type="text" id="node-input-resultaction" style="width: 270px;">
                    <option value="none">ignore query results</option>
                    <option value="single">send single query result message</option>
                    <option value="single-meta">send single message with metadata</option>
                    <option value="multi">send multiple query result messages</option>
                </select>
            </div>

            <div class="form-row">
                <label for="node-input-resultlimit"><i class="fa fa-bars"></i> Msg rows</label>
                <input type="text" id="node-input-resultlimit" style="width: 80px;"> (maximum # of result rows per message)
            </div>
            <hr/>
            <div class="form-row" style="margin-bottom: 6px;">
                <input type="checkbox" id="node-input-splitoutputs" style="display: inline-block; width: auto; vertical-align: top;">
                <label for="node-input-splitoutputs" style="width: 80%;"> Separate error output port (Port 1 = Success, Port 2 = Error)</label>
                <input type="hidden" id="node-input-outputs">
            </div>
            <div class="form-row" style="margin-bottom: 0px">
                <input type="checkbox" id="node-input-usemany" style="display: inline-block; width: auto; vertical-align: top;">
                <label for="node-input-usemany" style="width: 80%;"> Batch mode (executeMany) &mdash; <i>msg.payload</i> is an array of bind objects/arrays</label>
            </div>
        </div>
    </div>
</script>

<script type="text/x-red" data-help-name="oracledb">
  <p>Oracle database node. Executes SQL queries, PL/SQL blocks, and stored procedures.</p>
  
  <h3>Inputs</h3>
  <dl class="message-properties">
    <dt>payload <span class="property-type">array | object</span></dt>
    <dd>
        If an array, the values are used as positional bind parameters for the query (e.g., <code>:1, :2</code>).
        If an object, it can be used with <b>Field Mappings</b> to generate the parameter array.
    </dd>
    <dt class="optional">query <span class="property-type">string | string[]</span></dt>
    <dd>An SQL query or an array of SQL queries to execute sequentially in a single batch. If not provided, the query configured in the node's editor will be used.</dd>
    <dt class="optional">bindVars <span class="property-type">object</span></dt>
    <dd>
        For advanced use cases like stored procedures with <code>OUT</code> parameters. This object provides explicit bind definitions.
        <pre>msg.bindVars = {
    output: { dir: "BIND_OUT", type: "STRING" },
    input:  { dir: "BIND_IN", val: "my_value" }
};</pre>
    </dd>
    <dt class="optional">fieldMappings <span class="property-type">array</span></dt>
    <dd>An array of strings used to map properties from an object in <code>msg.payload</code> to a positional array for binding.</dd>
  </dl>

  <h3>Outputs</h3>
  <p>The output depends on the <b>Action</b> selected in the "Query results" tab.</p>
  <dl class="message-properties">
      <dt>ignore query results</dt>
      <dd>No message is sent.</dd>
      <dt>send single query result message</dt>
      <dd>Sends <b>one message</b>. <code>msg.payload</code> will be an array containing <b>all rows</b> returned by the query.</dd>
      <dt>send single message with metadata</dt>
      <dd>Sends <b>one message</b>. <code>msg.payload</code> will be an object containing metadata like <code>rowsAffected</code> and any <code>outBinds</code> from a stored procedure. This is useful for DML (INSERT, UPDATE, DELETE) or procedure calls.</dd>
      <dt>send multiple query result messages</dt>
      <dd>
          Used for processing very large result sets without high memory usage. It sends <b>multiple messages</b>, each containing a chunk of rows. The size of the chunk is determined by the <b>Msg rows</b> setting.
          <br/><br/>
          <b>Note:</b> If the total number of rows is less than the "Msg rows" limit, this option will behave identically to "send single query result message".
      </dd>
  </dl>

  <h3>Dual Output Ports</h3>
  <p>When <b>Separate error output port</b> is enabled, the node exposes two output ports:</p>
  <ul>
      <li><b>Port 1 (top):</b> Successful query results.</li>
      <li><b>Port 2 (bottom):</b> Errors (with <code>msg.error</code>), allowing immediate routing to alerting or retry flows without requiring a separate Catch node.</li>
  </ul>
  
  <h3>Batch mode (executeMany)</h3>
  <p>Enable <b>Batch mode</b> (or set <code>msg.executeMany = true</code>) to insert/update many rows in a single round-trip. <code>msg.payload</code> must be an array of bind objects (named binds) or array of arrays (positional). The node sends a single output message with <code>{ rowsAffected, outBinds, batchErrors }</code>.</p>
  <pre>// 1000-row insert in one call
msg.payload = [ {id:1, name:"a"}, {id:2, name:"b"}, /* ... */ ];
msg.executeMany = true;
// query: INSERT INTO t (id, name) VALUES (:id, :name)</pre>

  <h3>Transactions</h3>
  <p>To execute multi-node atomic transactions across a flow, select <b>Begin Transaction</b> on the first node, <b>Continue Transaction</b> on intermediate nodes, and <b>Commit Transaction</b> on the final node. Wire error handling or a Catch node to a node configured with <b>Rollback Transaction</b>. Transactions pass an open connection handle on <code>msg._oracleTx</code> and include a 60-second safety rollback timer to guard against connection pool leaks.</p>

  <h3>Observability & Session Tracing</h3>
  <p>Pass <code>msg.action</code>, <code>msg.module</code>, or <code>msg.clientId</code> to tag your statements in Oracle Database's <code>V$SESSION</code> and OCI Performance Hub. The node automatically includes these in the <code>msg.oracle</code> stats sidecar object.</p>

  <h3>Oracle AI Database 23ai / 26ai Vectors</h3>
  <p>To bind vectors for AI similarity search (<code>VECTOR_DISTANCE</code>), pass a JavaScript <code>Float32Array</code> or <code>Float64Array</code> in <code>msg.payload</code> or <code>msg.bindVars</code>. The node automatically binds them as native Oracle <code>DB_TYPE_VECTOR</code>.</p>

  <h3>Executing Scripts</h3>
  <p>
      The node executes a single SQL statement or a single PL/SQL block at a time. To run multiple DML statements (<code>INSERT</code>, <code>UPDATE</code>, etc.) as a single transaction, wrap them in a <code>BEGIN...END;</code> block. To run multiple sequential queries, chain multiple <b>oracledb</b> nodes together in your flow.
  </p>
</script>
